name: release

# Cut a release: bump the workspace version, build every target from that
# commit, then fast-forward master to it, tag it v<version> and publish a GitHub
# release with the given notes and one zip per target.
#
# Nothing lands on master and no tag is made until every build (and the fmt /
# macOS test gates) passed. Until then the bump commit lives on a temporary
# `release/v<version>` branch, deleted at the end whatever the outcome. If
# master moved while the builds ran, the fast-forward fails: just run it again.
#
# The notes input on the web form is ONE line (pasted newlines are lost), so
# for multi-line markdown run it from the CLI:
#   gh workflow run release.yml -f version=0.6.0 -f notes="$(cat notes.md)"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, without the leading v (e.g. 0.6.0)
        required: true
        type: string
      notes:
        description: Release notes (markdown)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check inputs
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::run this from ${{ github.event.repository.default_branch }} (it pushes the bump there)"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like 1.2.3 or 1.2.3-rc.1, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check the tag is free
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The first `version = ` line of the root Cargo.toml is
      # [workspace.package]'s; every crate inherits it. `cargo update
      # --workspace` rewrites only the member entries of Cargo.lock.
      - name: Bump version
        run: |
          set -euo pipefail
          sed -i -E "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          grep -q "^version = \"$VERSION\"$" Cargo.toml
          cargo update --workspace
          git diff --stat

      # Same version as already in Cargo.toml (e.g. a re-run after a bump got
      # in but the release didn't) = nothing to commit; release HEAD as is.
      - name: Commit to the release branch
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "Release v$VERSION"
          fi
          git push --force origin "HEAD:refs/heads/release/v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ inputs.version }}

  publish:
    name: publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history: from a shallow clone git can't see that the bump commit
      # descends from master's tip, and refuses the push ("fetch first").
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: zdb-*
          path: artifacts

      # One zip per target, flat (zdb + sqls; macOS: the ditto'd zdb.app.zip).
      # Artifacts lose the exec bit, so restore it before zipping.
      - name: Zip
        run: |
          set -euo pipefail
          mkdir -p release
          for dir in artifacts/zdb-*/; do
            name="$(basename "$dir")"
            case "$name" in zdb-linux-*) chmod +x "$dir/zdb" "$dir/sqls" ;; esac
            (cd "$dir" && zip -r -X "$GITHUB_WORKSPACE/release/$name.zip" .)
          done
          ls -l release

      # Plain push = fast-forward only: refused if master moved meanwhile.
      - name: Push the bump to master
        run: git push origin "$SHA:refs/heads/${{ github.event.repository.default_branch }}"

      # The notes go through env + a file, never into the script text, so
      # backticks / $(...) in the markdown stay text.
      - name: Tag and release
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NOTES" > notes.md
          # 1.2.3-rc.1 → a pre-release (not marked Latest).
          pre=(); [[ "$VERSION" == *-* ]] && pre=(--prerelease)
          gh release create "v$VERSION" release/*.zip \
            --target "$SHA" \
            --title "v$VERSION" \
            --notes-file notes.md \
            "${pre[@]}"

  cleanup:
    name: cleanup
    needs: [prepare, publish]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/release/v$VERSION" || true
