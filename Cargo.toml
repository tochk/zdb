[workspace]
resolver = "2"
members = ["crates/zdb-app", "crates/zdb-db", "crates/zdb-config"]

[workspace.package]
version = "0.6.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tochk/zdb"
rust-version = "1.90"

[workspace.dependencies]
# UI stack (pinned per plan — verified on crates.io)
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-terminal = "0.1"
portable-pty = "0.9"
# SQL grammar for the editor's syntax highlighting. gpui-component gates all
# non-JSON grammars behind its all-or-nothing `tree-sitter-languages` feature
# (28 C grammar crates); we instead register just SQL ourselves (main.rs).
# Semver-compatible with gpui-component's own requirement, so the tree holds
# one copy.
tree-sitter-sequel = "0.3.11"

# Data layer
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2"
rustls-native-certs = "0.8.5"
futures-util = "0.3.34"

# Shared
anyhow = "1.0.104"
thiserror = "2.0.21"
sqlformat = "0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
directories = "6"
toml = "1.1"

[profile.release]
strip = true

[profile.dev]
# gpui/dependency build is heavy; keep debug builds bearable
opt-level = 0

[profile.dev.package."*"]
# optimize deps once, iterate fast on our own crates
opt-level = 2
