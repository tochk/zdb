[package]
name = "zdb-config"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Test-only: instrument `secret::get_password` so tests can assert the blocking
# keychain read is deferred off the UI thread (see zdb-app connect regression).
# Enabled via zdb-app's dev-dependency; never on in release builds.
test-probe = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
directories.workspace = true
anyhow.workspace = true
uuid = { version = "1.29", features = ["v4"] }
# OS keychain for connection passwords. keyring 4's `v1` feature (its default)
# picks the native store per platform: Windows Credential Manager, macOS
# Keychain, the Secret Service (over zbus) on Linux.
keyring = "4.2"
